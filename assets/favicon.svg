<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- FINAL brand mark (locked 2026-07-15, flipped to light background +
       plum accent 2026-07-15 when the Living Gradient system was adopted
       as the primary brand palette — see BRAND_KIT.md §6). Background is
       the system's neutral Midday tone (not a specific time-of-day mood,
       since a static logo shouldn't read as tied to one hour). Letterforms
       are baked vector paths extracted directly from the real Baskerville
       font file (not a CSS font-family reference — a prior Didot version
       hit a real bug where "font-family: Didot" silently resolved to Didot
       Bold in some render pipelines, since Didot.ttc bundles
       Regular/Italic/Bold as separate sub-faces). Baskerville has a genuine
       native Greek lambda glyph, used as-is. No surrounding circle —
       dropped per founder feedback ("I think the circle is what bothers
       me"); the thin vertical plum thread-line between the letters is the
       only remaining graphic device.
  -->
